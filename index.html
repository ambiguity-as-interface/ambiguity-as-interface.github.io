<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambiguity as Interface</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #f7f6f2;
      color: #222;
      font-family: Arial, sans-serif;
    }
    main { width: 100%; max-width: 900px; }
    .label {
      color: #62635e;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    h1 {
      margin: 24px 0;
      font-size: clamp(48px, 9vw, 100px);
      line-height: 1;
      letter-spacing: -0.05em;
    }
    h1 span { color: #6655cc; }
    p { font-size: 18px; line-height: 1.7; }
    footer {
      margin-top: 64px;
      padding-top: 20px;
      border-top: 1px solid #d9d8d2;
      color: #62635e;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="label">Project website</div>
    <h1>Ambiguity<br>as <span>Interface.</span></h1>
    <p>Exploring ambiguity in human–AI interaction.</p>
    <footer>More details coming soon.</footer>
  </main>
</body>
</html>
